services:

  # =============================================================
  # TRAEFIK - Reverse proxy & gestionnaire SSL/TLS
  # DNS Challenge via DuckDNS → certificat wildcard *.domaine.duckdns.org
  # =============================================================
  proxy:
    image: traefik
    container_name: traefik
    restart: unless-stopped
    networks:
      - cloud
    command:
      - '--log.level=DEBUG'
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--certificatesresolvers.letsencrypt.acme.dnschallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=duckdns'
      - '--certificatesresolvers.letsencrypt.acme.email=${MY_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.dnschallenge.disablePropagationCheck=true'
      - '--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.http.tls=true'
      - '--entrypoints.websecure.http.tls.certResolver=letsencrypt'
      - '--entrypoints.websecure.http.tls.domains[0].main=${MY_DOMAIN}'
      - '--entrypoints.websecure.http.tls.domains[0].sans=*.${MY_DOMAIN}'
    volumes:
      - '../data/traefik/letsencrypt:/letsencrypt'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`${MY_DOMAIN}`)'
      - 'traefik.http.routers.api.entryPoints=websecure'
      - 'traefik.http.routers.api.service=api@internal'
    ports:
      - '443:443'
      - '80:80'
    environment:
      - 'DUCKDNS_TOKEN=${DUCKDNS_TOKEN}'

  # =============================================================
  # PORTAINER - Interface de gestion Docker
  # Accessible via : portainer.<MY_DOMAIN>
  # =============================================================
  portainer:
    image: portainer/portainer-ce:alpine
    container_name: portainer
    restart: unless-stopped
    networks:
      - cloud
    # ports:
    #   - 9000:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.portainer.rule=Host(`portainer.${MY_DOMAIN}`)'
      - 'traefik.http.routers.portainer.entryPoints=websecure'
      - 'traefik.http.services.portainer.loadbalancer.server.port=9000'
      - 'traefik.http.routers.portainer.service=portainer'

  # =============================================================
  # JELLYFIN - Serveur multimédia
  # Accessible via : jellyfin.<MY_DOMAIN>
  # =============================================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - cloud
    # ports:
    #   - 8096:8096
    environment:
      - TZ=America/Montreal
    volumes:
      - jellyfin_data:/config
      - jellyfin_cache:/cache
      - ${JELLYFIN_MEDIA_PATH}:/media:ro
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.jellyfin.rule=Host(`jellyfin.${MY_DOMAIN}`)'
      - 'traefik.http.routers.jellyfin.entryPoints=websecure'
      - 'traefik.http.services.jellyfin.loadbalancer.server.port=8096'
      - 'traefik.http.routers.jellyfin.service=jellyfin'

  # =============================================================
  # BLOGVERSE - Base de données MySQL
  # Pas exposée à Traefik : usage interne uniquement
  # =============================================================
  blogverse-db:
    image: mysql:8.0
    container_name: blogverse-db
    restart: unless-stopped
    networks:
      - cloud
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - blogverse_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================
  # BLOGVERSE - Backend Node/Express
  # Route : blogverse.<MY_DOMAIN>/api → port 3001
  # =============================================================
  blogverse-backend:
    build:
      context: ./DA-blogverse-backend
      dockerfile: Dockerfile
    container_name: blogverse-backend
    restart: unless-stopped
    networks:
      - cloud
    environment:
      PORT: 3001
      DB_HOST: blogverse-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    depends_on:
      blogverse-db:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.blogverse-api.rule=Host(`blogverse.${MY_DOMAIN}`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.blogverse-api.entryPoints=websecure'
      - 'traefik.http.services.blogverse-api.loadbalancer.server.port=3001'
      - 'traefik.http.routers.blogverse-api.service=blogverse-api'

  # =============================================================
  # BLOGVERSE - Frontend Vite/React (servi par Nginx)
  # Accessible via : blogverse.<MY_DOMAIN>
  # =============================================================
  blogverse-frontend:
    build:
      context: ./DA-blogverse-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://blogverse.${MY_DOMAIN}/api
    container_name: blogverse-frontend
    restart: unless-stopped
    networks:
      - cloud
    depends_on:
      - blogverse-backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.blogverse.rule=Host(`blogverse.${MY_DOMAIN}`)'
      - 'traefik.http.routers.blogverse.entryPoints=websecure'
      - 'traefik.http.services.blogverse.loadbalancer.server.port=80'
      - 'traefik.http.routers.blogverse.service=blogverse'

# =============================================================
# VOLUMES
# =============================================================
volumes:
  portainer_data:
  jellyfin_data:
  jellyfin_cache:
  blogverse_db_data:

# =============================================================
# RÉSEAUX
# =============================================================
networks:
  cloud:
    driver: bridge